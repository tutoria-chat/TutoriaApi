        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    - name: Deploy to App Runner
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        SERVICE_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='${{ env.APP_RUNNER_SERVICE_PROD }}'].ServiceArn" --output text)

        if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" = "None" ]; then
          echo "Creating new App Runner service..."
          aws apprunner create-service \
            --service-name ${{ env.APP_RUNNER_SERVICE_PROD }} \
            --source-configuration '{
              "AuthenticationConfiguration": {
                "AccessRoleArn": "${{ secrets.APP_RUNNER_ECR_ROLE_ARN }}"
              },
              "AutoDeploymentsEnabled": false,
              "ImageRepository": {
                "ImageIdentifier": "'$ECR_REGISTRY/$ECR_REPOSITORY:latest'",
                "ImageRepositoryType": "ECR",
                "ImageConfiguration": {
                  "Port": "8080",
                  "RuntimeEnvironmentVariables": {
                    "ConnectionStrings__DefaultConnection": "${{ secrets.PROD_DB_CONNECTION_STRING }}",
                    "Jwt__SecretKey": "${{ secrets.PROD_JWT_SECRET_KEY }}",
                    "Jwt__Issuer": "${{ secrets.PROD_JWT_ISSUER }}",
                    "Jwt__Audience": "${{ secrets.PROD_JWT_AUDIENCE }}",
                    "AzureStorage__ConnectionString": "${{ secrets.PROD_AZURE_STORAGE_CONNECTION_STRING }}",
                    "AzureStorage__ContainerName": "${{ secrets.PROD_AZURE_STORAGE_CONTAINER }}",
                    "OpenAI__ApiKey": "${{ secrets.PROD_OPENAI_API_KEY }}",
                    "AiApi__BaseUrl": "${{ secrets.PROD_AI_API_BASE_URL }}",
                    "Stripe__SecretKey": "${{ secrets.PROD_STRIPE_SECRET_KEY }}",
                    "Stripe__WebhookSecret": "${{ secrets.PROD_STRIPE_WEBHOOK_SECRET }}",
                    "Resend__ApiKey": "${{ secrets.PROD_RESEND_API_KEY }}",
                    "Email__Enabled": "true",
                    "Email__FrontendUrl": "${{ secrets.PROD_EMAIL_FRONTEND_URL }}"
                  }
                }
              }
            }' \
            --instance-configuration '{
              "Cpu": "0.25 vCPU",
              "Memory": "0.5 GB"
            }' \
            --health-check-configuration '{
              "Protocol": "HTTP",
              "Path": "/health",
              "Interval": 20,
              "Timeout": 5,
              "HealthyThreshold": 1,
              "UnhealthyThreshold": 3
            }'
        else
          echo "Updating existing App Runner service..."
          aws apprunner update-service \
            --service-arn "$SERVICE_ARN" \
            --source-configuration '{
              "AuthenticationConfiguration": {
                "AccessRoleArn": "${{ secrets.APP_RUNNER_ECR_ROLE_ARN }}"
              },
              "AutoDeploymentsEnabled": false,
              "ImageRepository": {
                "ImageIdentifier": "'$ECR_REGISTRY/$ECR_REPOSITORY:latest'",
                "ImageRepositoryType": "ECR",
                "ImageConfiguration": {
                  "Port": "8080",
                  "RuntimeEnvironmentVariables": {
                    "ConnectionStrings__DefaultConnection": "${{ secrets.PROD_DB_CONNECTION_STRING }}",
                    "Jwt__SecretKey": "${{ secrets.PROD_JWT_SECRET_KEY }}",
                    "Jwt__Issuer": "${{ secrets.PROD_JWT_ISSUER }}",
                    "Jwt__Audience": "${{ secrets.PROD_JWT_AUDIENCE }}",
                    "AzureStorage__ConnectionString": "${{ secrets.PROD_AZURE_STORAGE_CONNECTION_STRING }}",
                    "AzureStorage__ContainerName": "${{ secrets.PROD_AZURE_STORAGE_CONTAINER }}",
                    "OpenAI__ApiKey": "${{ secrets.PROD_OPENAI_API_KEY }}",
                    "AiApi__BaseUrl": "${{ secrets.PROD_AI_API_BASE_URL }}",
                    "Stripe__SecretKey": "${{ secrets.PROD_STRIPE_SECRET_KEY }}",
                    "Stripe__WebhookSecret": "${{ secrets.PROD_STRIPE_WEBHOOK_SECRET }}",
                    "Resend__ApiKey": "${{ secrets.PROD_RESEND_API_KEY }}",
                    "Email__Enabled": "true",
                    "Email__FrontendUrl": "${{ secrets.PROD_EMAIL_FRONTEND_URL }}"
                  }
                }
              }
            }'
        fi

    - name: Wait for App Runner deployment
      run: |
        SERVICE_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='${{ env.APP_RUNNER_SERVICE_PROD }}'].ServiceArn" --output text)
        for i in $(seq 1 30); do
          STATUS=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --query "Service.Status" --output text)
          echo "Status: $STATUS (attempt $i/30)"
          if [ "$STATUS" = "RUNNING" ]; then
            URL=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --query "Service.ServiceUrl" --output text)
            echo "## App Runner PROD Deployment" >> $GITHUB_STEP_SUMMARY
            echo "**URL**: https://$URL" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          sleep 20
        done
        echo "Deployment timed out" && exit 1
