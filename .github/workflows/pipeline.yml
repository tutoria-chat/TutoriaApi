name: Pipeline - Build, Test & Deploy

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - 'Dockerfile'
      - '.github/workflows/pipeline.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - prod

env:
  DOTNET_VERSION: '10.0.x'
  AWS_REGION: us-east-2
  ECR_REPOSITORY: tutoria-dotnet-api
  APP_RUNNER_SERVICE_DEV: tutoria-dotnet-api-dev
  APP_RUNNER_SERVICE_PROD: tutoria-dotnet-api-prod

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore TutoriaApi.sln

    - name: Build solution
      run: dotnet build TutoriaApi.sln --configuration Release --no-restore

    - name: Run unit tests
      run: dotnet test TutoriaApi.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: './TestResults/**/*.trx'
        retention-days: 30

    - name: Publish Unified API (Management + Auth)
      run: dotnet publish src/TutoriaApi.Web.API/TutoriaApi.Web.API.csproj --configuration Release --output ./publish --no-build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: ./publish
        retention-days: 7

  # deploy/<env>.env: AWS=true/false and AZURE=true/false, plus the Azure ids (not
  # secrets). Push to main = dev; a manual run = the environment picked.
  targets:
    name: Where to deploy
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      env: ${{ steps.read.outputs.env }}
      aws: ${{ steps.read.outputs.aws }}
      azure: ${{ steps.read.outputs.azure }}
      tenant: ${{ steps.read.outputs.tenant }}
      subscription: ${{ steps.read.outputs.subscription }}
      client: ${{ steps.read.outputs.client }}
      registry: ${{ steps.read.outputs.registry }}
      rg: ${{ steps.read.outputs.rg }}
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Read deploy/<env>.env
      id: read
      env:
        PICKED: ${{ inputs.environment }}
      run: |
        envname=dev
        [ "${{ github.event_name }}" = workflow_dispatch ] && envname="$PICKED"
        f="deploy/$envname.env"
        test -f "$f" || { echo "::error::$f is missing (is it git-ignored?)"; exit 1; }
        get() { sed -n "s/^$1=//p" "$f" | tail -n1 | tr -d '\r'; }
        for k in AWS AZURE; do v=$(get $k); case "$v" in true|false) ;; *) echo "::error::$k in $f must be true or false, is '$v'"; exit 1 ;; esac; done
        if [ "$(get AZURE)" = true ]; then
          for k in AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_CLIENT_ID AZURE_REGISTRY AZURE_RESOURCE_GROUP; do
            [ -n "$(get $k)" ] || { echo "::error::AZURE=true but $k is empty in $f"; exit 1; }
          done
        fi
        {
          echo "env=$envname"
          echo "aws=$(get AWS)"
          echo "azure=$(get AZURE)"
          echo "tenant=$(get AZURE_TENANT_ID)"
          echo "subscription=$(get AZURE_SUBSCRIPTION_ID)"
          echo "client=$(get AZURE_CLIENT_ID)"
          echo "registry=$(get AZURE_REGISTRY)"
          echo "rg=$(get AZURE_RESOURCE_GROUP)"
        } | tee -a "$GITHUB_OUTPUT"

  # ===================================================================
  # ELASTIC BEANSTALK DEPLOYMENTS (legacy - keeping prod until migration)
  # ===================================================================


  deploy-dev:
    name: Deploy to App Runner DEV
    runs-on: ubuntu-latest
    needs: [build-and-test, targets]
    if: |
      needs.targets.outputs.aws == 'true' && (
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev'))
    environment:
      name: development

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push Docker image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    - name: Deploy to App Runner
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        SERVICE_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='${{ env.APP_RUNNER_SERVICE_DEV }}'].ServiceArn" --output text)

        # Only env vars needed — the app loads everything else from SSM Parameter Store
        IMAGE_CONFIG='{
          "Port": "8080",
          "RuntimeEnvironmentVariables": {
            "ASPNETCORE_ENVIRONMENT": "Production",
            "AWS_SSM_PREFIX": "/tutoria/dev/",
            "AWS_REGION": "us-east-2"
          }
        }'

        if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" = "None" ]; then
          echo "Creating new App Runner service..."
          aws apprunner create-service \
            --service-name ${{ env.APP_RUNNER_SERVICE_DEV }} \
            --source-configuration '{
              "AuthenticationConfiguration": {
                "AccessRoleArn": "${{ secrets.APP_RUNNER_ECR_ROLE_ARN }}"
              },
              "AutoDeploymentsEnabled": false,
              "ImageRepository": {
                "ImageIdentifier": "'$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG'",
                "ImageRepositoryType": "ECR",
                "ImageConfiguration": '"$IMAGE_CONFIG"'
              }
            }' \
            --instance-configuration '{
              "Cpu": "0.25 vCPU",
              "Memory": "0.5 GB",
              "InstanceRoleArn": "${{ secrets.APP_RUNNER_INSTANCE_ROLE_ARN }}"
            }' \
            --health-check-configuration '{
              "Protocol": "HTTP",
              "Path": "/health",
              "Interval": 20,
              "Timeout": 5,
              "HealthyThreshold": 1,
              "UnhealthyThreshold": 3
            }'
        else
          echo "Updating existing App Runner service..."
          aws apprunner update-service \
            --service-arn "$SERVICE_ARN" \
            --source-configuration '{
              "AuthenticationConfiguration": {
                "AccessRoleArn": "${{ secrets.APP_RUNNER_ECR_ROLE_ARN }}"
              },
              "AutoDeploymentsEnabled": false,
              "ImageRepository": {
                "ImageIdentifier": "'$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG'",
                "ImageRepositoryType": "ECR",
                "ImageConfiguration": '"$IMAGE_CONFIG"'
              }
            }' \
            --instance-configuration '{
              "InstanceRoleArn": "${{ secrets.APP_RUNNER_INSTANCE_ROLE_ARN }}"
            }'
        fi

    - name: Wait for App Runner deployment
      run: |
        SERVICE_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='${{ env.APP_RUNNER_SERVICE_DEV }}'].ServiceArn" --output text)

        # Phase 1: wait for App Runner to start the operation (leave RUNNING state)
        echo "Waiting for operation to start..."
        for i in $(seq 1 15); do
          STATUS=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --query "Service.Status" --output text)
          echo "Status: $STATUS (phase 1, attempt $i/15)"
          if [ "$STATUS" != "RUNNING" ]; then
            echo "Operation started (status: $STATUS)"
            break
          fi
          sleep 10
        done

        # Phase 2: wait for RUNNING again (deployment complete)
        echo "Waiting for deployment to complete..."
        for i in $(seq 1 40); do
          STATUS=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --query "Service.Status" --output text)
          echo "Status: $STATUS (phase 2, attempt $i/40)"
          if [ "$STATUS" = "RUNNING" ]; then
            URL=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --query "Service.ServiceUrl" --output text)
            echo "## App Runner DEV Deployment" >> $GITHUB_STEP_SUMMARY
            echo "**URL**: https://$URL" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          if [ "$STATUS" = "CREATE_FAILED" ] || [ "$STATUS" = "DELETE_FAILED" ]; then
            echo "Deployment FAILED with status: $STATUS" && exit 1
          fi
          sleep 20
        done
        echo "Deployment timed out" && exit 1

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-test, targets]
    if: needs.targets.outputs.aws == 'true' && github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    environment:
      name: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push Docker image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    - name: Deploy to App Runner
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        SERVICE_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='${{ env.APP_RUNNER_SERVICE_PROD }}'].ServiceArn" --output text)

        # Only env vars needed — the app loads everything else from SSM Parameter Store
        IMAGE_CONFIG='{
          "Port": "8080",
          "RuntimeEnvironmentVariables": {
            "ASPNETCORE_ENVIRONMENT": "Production",
            "AWS_SSM_PREFIX": "/tutoria/prod/",
            "AWS_REGION": "us-east-2"
          }
        }'

        if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" = "None" ]; then
          echo "Creating new App Runner service..."
          aws apprunner create-service \
            --service-name ${{ env.APP_RUNNER_SERVICE_PROD }} \
            --source-configuration '{
              "AuthenticationConfiguration": {
                "AccessRoleArn": "${{ secrets.APP_RUNNER_ECR_ROLE_ARN }}"
              },
              "AutoDeploymentsEnabled": false,
              "ImageRepository": {
                "ImageIdentifier": "'$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG'",
                "ImageRepositoryType": "ECR",
                "ImageConfiguration": '"$IMAGE_CONFIG"'
              }
            }' \
            --instance-configuration '{
              "Cpu": "1 vCPU",
              "Memory": "2 GB",
              "InstanceRoleArn": "${{ secrets.APP_RUNNER_INSTANCE_ROLE_ARN }}"
            }' \
            --health-check-configuration '{
              "Protocol": "HTTP",
              "Path": "/health",
              "Interval": 20,
              "Timeout": 5,
              "HealthyThreshold": 1,
              "UnhealthyThreshold": 3
            }'
        else
          echo "Updating existing App Runner service..."
          aws apprunner update-service \
            --service-arn "$SERVICE_ARN" \
            --source-configuration '{
              "AuthenticationConfiguration": {
                "AccessRoleArn": "${{ secrets.APP_RUNNER_ECR_ROLE_ARN }}"
              },
              "AutoDeploymentsEnabled": false,
              "ImageRepository": {
                "ImageIdentifier": "'$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG'",
                "ImageRepositoryType": "ECR",
                "ImageConfiguration": '"$IMAGE_CONFIG"'
              }
            }' \
            --instance-configuration '{
              "Cpu": "1 vCPU",
              "Memory": "2 GB",
              "InstanceRoleArn": "${{ secrets.APP_RUNNER_INSTANCE_ROLE_ARN }}"
            }'
        fi

    - name: Wait for App Runner deployment
      run: |
        SERVICE_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='${{ env.APP_RUNNER_SERVICE_PROD }}'].ServiceArn" --output text)

        echo "Waiting for operation to start..."
        for i in $(seq 1 15); do
          STATUS=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --query "Service.Status" --output text)
          echo "Status: $STATUS (phase 1, attempt $i/15)"
          if [ "$STATUS" != "RUNNING" ]; then
            echo "Operation started (status: $STATUS)"
            break
          fi
          sleep 10
        done

        echo "Waiting for deployment to complete..."
        for i in $(seq 1 40); do
          STATUS=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --query "Service.Status" --output text)
          echo "Status: $STATUS (phase 2, attempt $i/40)"
          if [ "$STATUS" = "RUNNING" ]; then
            URL=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --query "Service.ServiceUrl" --output text)
            echo "## App Runner PROD Deployment" >> $GITHUB_STEP_SUMMARY
            echo "**URL**: https://$URL" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          if [ "$STATUS" = "CREATE_FAILED" ] || [ "$STATUS" = "DELETE_FAILED" ]; then
            echo "Deployment FAILED with status: $STATUS" && exit 1
          fi
          sleep 20
        done
        echo "Deployment timed out" && exit 1

  deploy-azure:
    name: Deploy to Azure DEV
    runs-on: ubuntu-latest
    needs: [build-and-test, targets]
    if: |
      needs.targets.outputs.azure == 'true' && needs.targets.outputs.env == 'dev' && (
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch')
    concurrency:
      group: azure-${{ needs.targets.outputs.env }}-${{ github.workflow }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # GitHub OIDC → the tutoria-github-<env> identity
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Azure login (OIDC)
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ needs.targets.outputs.client }}
        tenant-id: ${{ needs.targets.outputs.tenant }}
        subscription-id: ${{ needs.targets.outputs.subscription }}

    - name: Build, push and roll out
      env:
        APP: tutoria-api-${{ needs.targets.outputs.env }}
        IMAGE_NAME: tutoria-api
        RG: ${{ needs.targets.outputs.rg }}
        REGISTRY: ${{ needs.targets.outputs.registry }}
        PORT: "8080"
        HEALTH: "/health/ready"
        # First start migrates and seeds: give it time.
        TIMEOUT_SECONDS: "900"
      run: bash deploy/azure-deploy.sh

  deploy-azure-prod:
    name: Deploy to Azure PROD
    runs-on: ubuntu-latest
    needs: [build-and-test, targets]
    if: needs.targets.outputs.azure == 'true' && needs.targets.outputs.env == 'prod' && github.event_name == 'workflow_dispatch'
    # Signs in through the "production" environment's federated credential.
    environment: production
    concurrency:
      group: azure-${{ needs.targets.outputs.env }}-${{ github.workflow }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # GitHub OIDC → the tutoria-github-<env> identity
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Azure login (OIDC)
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ needs.targets.outputs.client }}
        tenant-id: ${{ needs.targets.outputs.tenant }}
        subscription-id: ${{ needs.targets.outputs.subscription }}

    - name: Build, push and roll out
      env:
        APP: tutoria-api-${{ needs.targets.outputs.env }}
        IMAGE_NAME: tutoria-api
        RG: ${{ needs.targets.outputs.rg }}
        REGISTRY: ${{ needs.targets.outputs.registry }}
        PORT: "8080"
        HEALTH: "/health/ready"
        # First start migrates and seeds: give it time.
        TIMEOUT_SECONDS: "900"
      run: bash deploy/azure-deploy.sh
